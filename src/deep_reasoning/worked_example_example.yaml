name: add a namespace with a worked example
messages:
  - {role: user, content: "Set up a recipes helper: it answers from my recipe files, the .txt files in my folder, and always names the recipe it used. Give it one example."}
  - role: assistant
    content: |
      <think>One write per cell. First the helper, its instructions saying what it always does, in the user's words.</think>
      <repl>
      print(library.add_namespace("recipes", {"system_suffix": "Answer from the recipe files, the .txt files in the working folder, and always name the recipe you used."}))
      </repl>
  - role: user
    content: |
      <observation>
      {'done': 'added', 'what': 'namespace', 'namespace': 'recipes', 'name': 'recipes'}
      </observation>
  - role: assistant
    content: |
      <think>Now the example, as turns, typing no tags: its first step prints what it reads, as a cell shows only what it prints, and the next answers from what was printed, naming the recipe. Each code is a raw string over several lines.</think>
      <repl>
      turns = [
          {"user": "What can I make with leeks?"},
          {"think": "Read the recipe files and print each one that mentions leeks.", "code": r"""
      from pathlib import Path
      for path in sorted(Path().glob("*.txt")):
          text = path.read_text(encoding="utf-8")
          if "leek" in text.lower():
              print(path.name, "|", text)
      """},
          {"observation": "leek_soup.txt | Leek and potato soup. Serves 4: 3 leeks, 2 potatoes, 1 litre of stock."},
          {"think": "One recipe has leeks: answer from it, naming it.", "code": r"""
      FinalAnswer("You can make leek and potato soup (leek_soup.txt): it serves 4 and needs 3 leeks, 2 potatoes and a litre of stock.")
      """},
      ]
      print(library.write_decomposition("recipes", "what can I make with leeks", turns))
      </repl>
  - role: user
    content: |
      <observation>
      {'done': 'added', 'what': 'decomposition', 'namespace': 'recipes', 'name': 'what can I make with leeks', 'problems': []}
      </observation>
  - role: assistant
    content: |
      <think>Both were written, and the example has no problems.</think>
      <repl>
      FinalAnswer(
          "I set up a recipes helper: it answers from the recipe files in your folder and always "
          'names the recipe it used, with one example to follow, "what can I make with leeks". '
          "Pick recipes under the message box to use it from your next message."
      )
      </repl>
