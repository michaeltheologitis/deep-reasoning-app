name: read the Library
messages:
  - {role: user, content: "What does the historian's suffix say?"}
  - role: assistant
    content: |
      <think>The user asks what this app's Library holds, in any words or language: here the historian namespace's system_suffix; or any namespace's tools, vars, spawn list or worked examples, root's included, the tools, or what changed. That is the Library, not this chat's record, which is all the historian reads; I can't read it here, as ctx and my own prompt show only part of my own setup. The librarian reads it. Hand it the user's message as written (ctx.task, never reworded) and this conversation, and answer with what it says.</think>
      <repl>
      FinalAnswer(subagent(ctx.task, namespace="librarian", history=ctx.history))
      </repl>
