<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Reasoning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
<a class="skip" id="skip" href="#input">Skip to the message box</a>
<div class="app" id="app">
  <div class="sidebar" id="sidebar" role="complementary" aria-label="Chats">
    <div class="brand"><span aria-hidden="true">✻</span> Deep Reasoning<button type="button" class="drawer-close" id="drawer-close" aria-label="Close the chats">×</button></div>
    <button type="button" class="new-chat" id="new-chat">+ New chat</button>
    <div class="label" id="chats-label">Chats</div>
    <ul class="chats" id="chats" aria-labelledby="chats-label"></ul>
    <button type="button" class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings">settings</button>
  </div>
  <main class="main" id="main">
    <header class="topbar">
      <button type="button" class="menu" id="menu" aria-label="Chats" aria-expanded="false" aria-controls="sidebar">☰</button>
      <h1 class="title" id="title"></h1>
      <button type="button" class="library-toggle" id="library-toggle" aria-expanded="false" aria-controls="library">library</button>
      <button type="button" class="theme" id="theme"></button>
    </header>
    <div class="scroll" id="scroll"><div class="log" id="log"></div></div>
    <form class="composer" id="composer">
      <div class="above" id="above"></div>
      <div class="box">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
        <button type="submit" class="send" id="send">send</button>
        <button type="button" class="stop" id="stop" hidden>stop</button>
      </div>
      <div class="hints">
        <span id="hint" aria-live="polite"></span>
        <span class="state">
          <span class="choices" id="choices" hidden>
            <button type="button" class="choice" id="folder" aria-haspopup="dialog" aria-expanded="false"><span id="folder-name"></span><span class="set-missing" id="folder-missing"></span><span aria-hidden="true"> ▾</span></button>
            <span aria-hidden="true">·</span>
            <button type="button" class="choice" id="namespace" aria-haspopup="listbox" aria-expanded="false"><span class="ns-name" id="namespace-name"></span><span aria-hidden="true"> ▾</span></button>
            <span aria-hidden="true">·</span>
            <button type="button" class="choice" id="model" aria-haspopup="listbox" aria-expanded="false"><span id="model-name"></span><span class="provider" id="model-provider"></span><span class="set-missing" id="model-missing"></span><span aria-hidden="true"> ▾</span></button>
          </span>
          <span id="total"></span>
        </span>
      </div>
    </form>
  </main>
  <div class="sr-only" id="announce" aria-live="polite"></div>
  <div class="library" id="library" role="complementary" aria-label="Library" hidden></div>
  <div class="library" id="settings" role="complementary" aria-label="Settings" hidden></div>
</div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/js-yaml.min.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="library.js"></script>
<script type="module" src="settings.js"></script>
</body>
</html>
