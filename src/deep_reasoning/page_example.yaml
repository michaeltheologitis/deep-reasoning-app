name: show it on a page
messages:
  - {role: user, content: "Show me on a page how you got your answer to my first message."}
  - role: assistant
    content: |
      <think>The user asks to see on a page how an earlier answer was worked out. I can't open a page, and how it was worked out is recorded, not shown here: the historian reads the record and opens pages. Hand it the user's message as written (ctx.task, never reworded) and this conversation, and answer with what it finds.</think>
      <repl>
      FinalAnswer(subagent(ctx.task, namespace="historian", history=ctx.history))
      </repl>
  - {role: user, content: "Show me on a page how you got your answer to my first message."}
  - role: assistant
    content: |
      <think>Read what message 1 actually did, its top agent's steps and its sub-agents, before choosing what to show.</think>
      <repl>
      print(history.steps(1))
      print(history.agents(1))
      </repl>
  - role: user
    content: |
      <observation>
      [{'kind': 'think', 'text': 'Give each part to its own sub-agent, then add the two.', 'drive': 1}, {'kind': 'cell', 'code': 'primes = subagent("Sum the first 10 primes.")\nfib = subagent("Find the 10th Fibonacci number.")\nprint(primes, fib)', 'output': '129 55', 'status': 'done', 'agents': [2, 3], 'drive': 1}, {'kind': 'cell', 'code': 'FinalAnswer(primes + fib)', 'output': 'FinalAnswer: 184', 'status': 'done', 'agents': [], 'drive': 1}]
      [{'node': 2, 'parent': 1, 'drive': 1, 'task': 'Sum the first 10 primes.', 'namespace': 'root', 'status': 'done', 'result': '129', 'cost': 0.0001305, 'steps': 2, 'failed': 0}, {'node': 3, 'parent': 1, 'drive': 1, 'task': 'Find the 10th Fibonacci number.', 'namespace': 'root', 'status': 'done', 'result': '55', 'cost': 0.0001275, 'steps': 2, 'failed': 0}]
      </observation>
  - role: assistant
    content: |
      <think>The cell at index 1 gave the two parts to sub-agents 2 and 3, and the one at index 2 added their answers. Show both steps and the first sub-agent's own work, each with a note saying what it did.</think>
      <repl>
      p = page.new("How the answer to message 1 was reached")
      p.text("The answer, **184**, came in two parts: two sub-agents worked them out, and the top agent added their results.")
      p.step(1, index=1, note="It gave each part to a sub-agent of its own.")
      p.agent(1, 2, note="The first summed the first 10 primes: 129.")
      p.step(1, index=2, note="Then it added the two answers: 129 + 55 = 184.")
      print(p.open())
      </repl>
  - role: user
    content: |
      <observation>
      Opened the page "How the answer to message 1 was reached"; the chat links it under your answer.
      </observation>
  - role: assistant
    content: |
      <think>The page is open, and the chat links it under my answer. Say what I found, in short.</think>
      <repl>
      FinalAnswer(
          "The answer, 184, came in two parts: the top agent gave each to a sub-agent, one "
          "summing the first 10 primes, 129, and the other finding the 10th Fibonacci number, "
          "55, then added them. The page shows those two steps and the first sub-agent's work."
      )
      </repl>
